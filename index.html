      }).join("")
    + '</ul></section>' + xferHTML(l.length);
}

const SEP = /[\s,;:.\-\u2013\u2014_/\\|()\[\]]/;
function parseCast(raw){
  const pts = [], bad = [];
  for (const ch of raw){
    if (ch === "1" || ch === "2") pts.push(ch);
    else if (SEP.test(ch)) continue;
    else if (!bad.includes(ch)) bad.push(ch);
  }
  let error = null;
  if (bad.length) error = "Only 1 and 2 are points. Remove " + bad.map(c => "\u201c"+c+"\u201d").join(", ") + ".";
  else if (pts.length > 16) error = pts.length + " points entered. A cast has 16 \u2014 remove " + (pts.length-16) + ".";
  return { pts, error };
}

/* ── pasted entries ──────────────────────────────────────
   A line lifted out of a journal carries more than the points:

     - Geomancy: What’s the potential between Vivi and me? 7th. 2211211122121122

   The sixteen points are the only long run of 1s and 2s such a line
   can hold, so they come out without disturbing the prose around
   them; an ordinal names the significator, and what is left over is
   the question. Anything without letters in it is left to parseCast
   untouched, so typing by hand behaves exactly as it did. */

function houseFrom(s){
  let m = /\bhouse\s*(\d{1,2})\b/i.exec(s);
  if (!m) m = /\b(\d{1,2})\s*(?:st|nd|rd|th)\b(?:\s*house)?/i.exec(s);
  const h = m ? +m[1] : 0;
  return (h >= 1 && h <= 12) ? { house:h, token:m[0] } : { house:0, token:null };
}

function tidyQuestion(s){
  /* an explicit label wins — it is what the chart's own export writes */
  const lab = /\bquestion[ \t]*:[ \t]*(.+)/i.exec(s);
  if (lab) s = lab[1];
  return s.replace(/^[\s>*•\-–—]+/, "")
          .replace(/^[A-Za-z][A-Za-z ]{0,18}:\s*/, "")
          .replace(/\s+/g, " ")
          .replace(/^[\s.,;:\-–—]+|[\s.,;:\-–—]+$/g, "")
          .trim();
}

function parseEntry(raw){
  if (!/[A-Za-z]/.test(raw)) return null;
  const run = /(?:[12][\s,;:._\/\\|()\[\]–—-]*){12,}/g;
  let m, best = null;
  while ((m = run.exec(raw))){
    const d = m[0].replace(/[^12]/g, "");
    if (!best || d.length > best.d.length) best = { d:d, at:m.index, len:m[0].length };
  }
  if (!best) return null;
  let rest = raw.slice(0, best.at) + " " + raw.slice(best.at + best.len);
  const h = houseFrom(rest);
  if (h.token) rest = rest.replace(h.token, " ");
  return { pts: best.d.slice(0,16), sig: h.house, question: tidyQuestion(rest) };
}

const RING_POS = {12:[-30,146],1:[-30,286],2:[-30,426],11:[140,-22],10:[280,-22],9:[420,-22],
  8:[590,146],7:[590,286],6:[590,426],3:[140,594],4:[280,594],5:[420,594]};

function chartSVG(houses, res){
  const S = 560, P = (u,v) => [u*S, v*S], ring = signRing(houses);
  const cen = h => P(REGIONS[h].glyph[0], REGIONS[h].glyph[1]);
  let s = '<svg viewBox="-52 -50 '+(S+104)+' '+(S+100)+'" class="chart" role="img" aria-label="Geomantic house chart">';

  for (const h in REGIONS){
    const f = BY_KEY[houses[h]];
    const sel = state.selected === +h;
    s += '<polygon class="region'+(sel?" sel":"")+(houses.sig===+h?" sig":"")+'" data-h="'+h+'" points="'
       + REGIONS[h].poly.map(p => P(p[0],p[1]).join(",")).join(" ")
       + '" style="fill:'+EL[f.el].c+'"/>';
  }
  s += channelLineSVG(channelLines(houses, res, state.selected), cen);
  s += '<rect x="0" y="0" width="'+S+'" height="'+S+'" fill="none" stroke="var(--rule)" stroke-width="2"/>';
  [[[0,0],[1,1]],[[1,0],[0,1]],[[.5,0],[1,.5]],[[1,.5],[.5,1]],[[.5,1],[0,.5]],[[0,.5],[.5,0]]].forEach(seg => {
    const a = P(seg[0][0],seg[0][1]), b = P(seg[1][0],seg[1][1]);
    s += '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="var(--rule)" stroke-width="1.2"/>';
  });
  for (const h in REGIONS){
    const f = BY_KEY[houses[h]], g = cen(h), d = dignity(f, +h);
    const n = P(REGIONS[h].num[0], REGIONS[h].num[1]);
    const nameDy = (h === "11" || h === "9") ? -32 : 38;
    const marks = (d || "") + (houses.pof === +h ? " \u2297" : "");
    s += '<g class="region-g" data-h="'+h+'">'
       + '<text x="'+n[0]+'" y="'+n[1]+'" text-anchor="middle" class="hnum">'+h+'</text>'
       + '<g transform="translate('+(g[0]-32.8)+','+(g[1]-25.6)+')" style="color:'+EL[f.el].c+'">'+glyph(f.key,1.6)+'</g>'
       + '<text x="'+(g[0]+29)+'" y="'+(g[1]+1)+'" text-anchor="middle" class="hplanet">'+(PLANET_GLYPH[f.planet]||"")+'</text>'
       + (marks ? '<text x="'+(g[0]+29)+'" y="'+(g[1]+19)+'" text-anchor="middle" class="hdig">'+marks+'</text>' : '')
       + '<text x="'+g[0]+'" y="'+(g[1]+nameDy)+'" text-anchor="middle" class="fname">'+f.name+'</text></g>';
  }
  if (ring) for (const h in RING_POS)
    s += '<text x="'+RING_POS[h][0]+'" y="'+RING_POS[h][1]+'" text-anchor="middle" class="hsign">'+ring[h][1]+'</text>';
  return s + '</svg>';
}

/* ── the shield: the sixteen figures as they are raised, read right to left,
   mothers first, each pair folding into the figure below it ── */
const SHIELD_HOUSE = {};
for (const h in ALLOTMENT.map) SHIELD_HOUSE[ALLOTMENT.map[h]] = +h;
const SHIELD_TAG = {M1:"Mother 1",M2:"Mother 2",M3:"Mother 3",M4:"Mother 4",
  D1:"Daughter 1",D2:"Daughter 2",D3:"Daughter 3",D4:"Daughter 4",
  N1:"Niece 1",N2:"Niece 2",N3:"Niece 3",N4:"Niece 4",
  RW:"Right witness",LW:"Left witness",Judge:"Judge",
  Reconciler:"Reconciler \u00b7 Judge + Mother 1 (Zelator, Henson)"};

function shieldSVG(sh, houses){
  const CW = 104, RH = 132, WIDE = CW*8;          /* eight columns of mothers and daughters */
  const yBase = RH*2, SIDE = 140, DEEP = 110;     /* the shield's straight flanks, then its swell */
  const GAP = 26;

  /* The base's bottom is one cubic. Its first control point stands directly
     below the left flank and its second below the right, so the curve leaves
     each flank travelling straight down and the swell turns without a corner;
     DEEP is the depth at the middle, which for a cubic is three quarters of
     the control arm. Sub-arcs of the same curve close the three wedges. */
  const P0 = [0, yBase+SIDE], P3 = [WIDE, yBase+SIDE], ARM = DEEP*4/3;
  const C1 = [0, yBase+SIDE+ARM], C2 = [WIDE, yBase+SIDE+ARM];
  const at = (t,i) => { const u = 1-t;
    return u*u*u*P0[i] + 3*u*u*t*C1[i] + 3*u*t*t*C2[i] + t*t*t*P3[i]; };
  const slope = (t,i) => { const u = 1-t;
    return 3*u*u*(C1[i]-P0[i]) + 6*u*t*(C2[i]-C1[i]) + 3*t*t*(P3[i]-C2[i]); };
  const pt = (f,t) => [+f(t,0).toFixed(2), +f(t,1).toFixed(2)];
  const qPt = t => pt(at, t);
  /* the stretch between two parameters, lifted out as a cubic of its own:
     the ends are points on the curve, the handles a third of its tangent */
  const arc = (a,b) => {
    const h = (t,k) => [0,1].map(i => +(at(t,i) + k*(b-a)/3*slope(t,i)).toFixed(2));
    return "C" + h(a,1) + " " + h(b,-1) + " " + qPt(b);
  };
  const apex = [WIDE/2, yBase], tL = 0.30, tR = 0.70;

  let fills = "", edges = "", marks = "";
  const face = (key, shape, cx, yTag, cls) => {
    const f = BY_KEY[sh[key]], h = SHIELD_HOUSE[key] || 0;
    const hit = h ? ' data-h="'+h+'"' : "";
    fills += shape('class="'+(h ? "region" : "scell")+(h && state.selected===h ? " sel" : "")
          + (h && houses.sig===h ? " sig" : "")+'"'+hit, 'style="fill:'+EL[f.el].c+'"');
    edges += shape('fill="none" stroke="var(--rule)" stroke-width="1.2" pointer-events="none"', "");
    marks += '<g class="region-g"'+hit+'>'
          + '<text x="'+cx+'" y="'+yTag+'" text-anchor="middle" class="stag">'+SHIELD_TAG[key]+'</text>'
          + '<g transform="translate('+(cx-19.5)+','+(yTag+12)+')" style="color:'+EL[f.el].c+'">'
          + glyph(f.key,1.5)+'</g>'
          + '<text x="'+cx+'" y="'+(yTag+92)+'" text-anchor="middle" class="sname">'+f.name+'</text>'
          + (h ? '<text x="'+cx+'" y="'+(yTag+108)+'" text-anchor="middle" class="shouse">house '+h+'</text>' : "")
          + '</g>';
  };
  const box = (x,y,w,h,rx) => (a,b) =>
    '<rect '+a+' x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'"'+(rx?' rx="'+rx+'"':"")+' '+b+'/>';
  const wedge = d => (a,b) => '<path '+a+' d="'+d+'" '+b+'/>';

  /* mothers at the right, daughters to their left; each pair folds into the niece below */
  [{y:0, w:CW, keys:["D4","D3","D2","D1","M4","M3","M2","M1"]},
   {y:RH, w:CW*2, keys:["N4","N3","N2","N1"]}].forEach(r =>
    r.keys.forEach((k,i) => face(k, box(i*r.w, r.y, r.w, RH), i*r.w + r.w/2, r.y+20)));

  face("LW", wedge("M"+apex+" L0,"+yBase+" L"+P0+" "+arc(0,tL)+" L"+apex+" Z"),
       WIDE*0.192, yBase+70);
  face("Judge", wedge("M"+apex+" L"+qPt(tL)+" "+arc(tL,tR)+" L"+apex+" Z"),
       WIDE/2, yBase+120);
  face("RW", wedge("M"+apex+" L"+qPt(tR)+" "+arc(tR,1)+" L"+WIDE+","+yBase+" Z"),
       WIDE*0.808, yBase+70);

  const yRec = yBase + SIDE + DEEP + GAP;
  face("Reconciler", box((WIDE-CW*3)/2, yRec, CW*3, RH, 12), WIDE/2, yRec+20);

  return '<svg viewBox="-8 -8 '+(WIDE+16)+' '+(yRec+RH+16)+'" class="chart" role="img" '
       + 'aria-label="Geomantic shield">'+fills+edges+marks+'</svg>';
}

/* Circular wheel: ascendant due west, houses counterclockwise, 30 degrees each. */
const W = {cx:310, cy:310, rOut:300, rSign:262, rSignG:281, rName:230, rPlan:230, rFig:168, rNum:124, rHub:95};
const pol = (r,a) => [ (W.cx + r*Math.cos(a*Math.PI/180)).toFixed(2),
                       (W.cy - r*Math.sin(a*Math.PI/180)).toFixed(2) ];
const houseStart = h => 180 + 30*(h-1);
const houseMid   = h => 195 + 30*(h-1);
function annulus(r1,r2,a1,a2){
  return "M"+pol(r2,a1)+"A"+r2+" "+r2+" 0 0 0 "+pol(r2,a2)
       + "L"+pol(r1,a2)+"A"+r1+" "+r1+" 0 0 1 "+pol(r1,a1)+"Z";
}

/* Name and ruling planet share a ring just inside the rim, set as one line
   across the arc and centred on the house's mid-line. How much of each box
   lies across the wedge depends on how the wedge is turned, so both steps are
   measured from the widest name the wheel can carry: the planets then come out
   level with one another, a ring of their own, wherever they fall. */
const NAME_BOX = [51, 21], PLANET_BOX = [18, 18];
function ringRow(m){
  const rad = m*Math.PI/180, a = Math.abs(Math.sin(rad)), b = Math.abs(Math.cos(rad));
  const nw = NAME_BOX[0]*a + NAME_BOX[1]*b, pw = PLANET_BOX[0]*a + PLANET_BOX[1]*b;
  const turn = t => m + t/W.rName * 180/Math.PI;        /* a step along the arc, in degrees */
  return {n: pol(W.rName, turn(-(pw + 6)/2)), p: pol(W.rPlan, turn((nw + 6)/2))};
}

/* A two-word name is set over two lines: no wedge is wide enough to take one
   whole without crowding the cusp lines either side of it. */
function wheelName(x, y, name){
  const w = name.split(" ");
  return '<text x="'+x+'" y="'+(+y - (w.length-1)*5.3).toFixed(2)+'" text-anchor="middle" class="wname">'
       + w.map((t,i) => '<tspan x="'+x+'"'+(i ? ' dy="10.6"' : '')+'>'+t+'</tspan>').join("")
       + '</text>';
}

function wheelSVG(houses, res){
  const ring = signRing(houses);
  let s = '<svg viewBox="0 0 620 620" class="chart" role="img" aria-label="Geomantic house wheel">';

  for (let h = 1; h <= 12; h++){
    const f = BY_KEY[houses[h]], a = houseStart(h);
    s += '<path class="region'+(state.selected===h?" sel":"")+(houses.sig===h?" sig":"")+'" data-h="'+h+'" d="'
       + annulus(W.rHub, W.rSign, a, a+30) + '" style="fill:'+EL[f.el].c+'"/>';
  }
  s += channelLineSVG(channelLines(houses, res, state.selected),
                      h => pol(W.rFig, houseMid(h)));
  [W.rOut, W.rSign, W.rHub].forEach((r,i) =>
    s += '<circle cx="'+W.cx+'" cy="'+W.cy+'" r="'+r+'" fill="none" stroke="var(--rule)" stroke-width="'+(i?1.2:2)+'"/>');
  for (let h = 1; h <= 12; h++){
    const a = houseStart(h), ang = (h-1) % 3 === 0;   /* cusps of the angles drawn heavier */
    s += '<line x1="'+pol(W.rHub,a)[0]+'" y1="'+pol(W.rHub,a)[1]+'" x2="'+pol(W.rOut,a)[0]+'" y2="'
       + pol(W.rOut,a)[1]+'" stroke="var(--rule)" stroke-width="'+(ang?2:1)+'"/>';
  }
  for (let h = 1; h <= 12; h++){
    const f = BY_KEY[houses[h]], m = houseMid(h), d = dignity(f,h), pof = houses.pof === h;
    const row = ringRow(m), gp = pol(W.rFig, m), np = row.n, pp = row.p;
    /* where a wedge lies sideways the dignity and fortune marks run radially,
       so the number is set out far enough for them to clear the hub */
    const flat = Math.abs(Math.cos(m*Math.PI/180)) > 0.9;
    const hp = pol(W.rHub + 18 + (flat ? ((d?11:0) + (pof?17:0))/2 : 0), m);
    if (ring){ const sp = pol(W.rSignG, m);
      s += '<text x="'+sp[0]+'" y="'+(+sp[1]+7)+'" text-anchor="middle" class="hsign">'+ring[h][1]+'</text>'; }
    s += '<g class="region-g" data-h="'+h+'">'
       + wheelName(np[0], np[1], f.name)
       + '<g transform="translate('+(gp[0]-20.8)+','+(+gp[1]-25.6)+')" style="color:'+EL[f.el].c+'">'+glyph(f.key,1.6)+'</g>'
       + '<text x="'+pp[0]+'" y="'+(+pp[1]+6)+'" text-anchor="middle" class="wplanet">'+(PLANET_GLYPH[f.planet]||"")+'</text>'
       + '<text x="'+hp[0]+'" y="'+(+hp[1]+5)+'" text-anchor="middle" class="hnum">' + h
       + (d ? '<tspan class="hdig" dx="4">'+d+'</tspan>' : '')
       + (pof ? '<tspan class="hpof" dx="4">\u2297</tspan>' : '') + '</text></g>';
  }
  /* the hub answers to a tap by letting the chosen house go, the Judge standing
     over the whole chart rather than over any one house */
  const J = BY_KEY[houses.judgeKey];
  s += '<g class="hub'+(state.selected ? " on" : "")+'" data-hub="1">'
     + '<circle cx="'+W.cx+'" cy="'+W.cy+'" r="'+W.rHub+'" fill="transparent"/>'
     + '<text x="'+W.cx+'" y="'+(W.cy-46)+'" text-anchor="middle" class="hubcap">JUDGE</text>'
     + '<g transform="translate('+(W.cx-24.7)+','+(W.cy-30.4)+')" style="color:'+EL[J.el].c+'">'+glyph(J.key,1.9)+'</g>'
     + '<text x="'+W.cx+'" y="'+(W.cy+52)+'" text-anchor="middle" class="hubname">'+J.name+'</text></g>';
  return s + '</svg>';
}

const esc = t => t.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const escA = t => esc(t).replace(/"/g, "&quot;");
const pad = (t,n) => (t + "                        ").slice(0,n);

function exportText(sh, houses, tally){
  const pofx = partOfFortune(sh, ALLOTMENT.map);
  const F = k => BY_KEY[k];
  const row = (lab,k) => "  " + pad(lab,16) + pad(F(k).name,16) + k;
  /* the chosen house is the thing demanded; with none chosen the first house
     answers for the matter as well as for the querent, as it did before. */
  const sig = state.sig || 0, dem = sig || 1;
  const L = [];
  L.push("GEOMANTIC CHART");
  L.push("Cast: " + [sh.M1, sh.M2, sh.M3, sh.M4].join(","));
  if (state.question) L.push("Question: " + state.question);
  L.push(sig
    ? "Significator: house " + sig + " — " + HOUSES[sig].title + " (" + HOUSES[sig].keys + ")"
    : "Significator: none chosen — read the first house for the matter as well as for the querent.");
  L.push("Notation: each figure is four rows head to feet; 1 = single point, 2 = double point.");
  L.push("");
  L.push("SHIELD");
  ["M1","M2","M3","M4"].forEach((k,i) => L.push(row("Mother "+(i+1), sh[k])));
  ["D1","D2","D3","D4"].forEach((k,i) => L.push(row("Daughter "+(i+1), sh[k])));
  ["N1","N2","N3","N4"].forEach((k,i) => L.push(row("Niece "+(i+1), sh[k])));
  L.push(row("Right witness", sh.RW));
  L.push(row("Left witness", sh.LW));
  L.push(row("Judge", sh.Judge));
  L.push(row("Reconciler", addFig(sh.Judge, houses[dem])) + "   (Judge + house " + dem
    + (sig ? ", the significator" : ", the first for want of a significator")
    + "; GD forms it from the house of the thing demanded)");
  L.push("");
  const ring = signRing(houses);
  L.push("HOUSES  (Golden Dawn allotment: Mothers angular, Daughters succedent,");
  L.push("         Nieces cadent, counterclockwise from the tenth)");
  if (ring) L.push("Ascendant: " + ring[1][0] + ", taken from the sign of the figure in house 1; the rest follow in order.");
  L.push("Dignity here is accidental: it is taken from the house a figure falls in,");
  L.push("the houses answering to the signs in order, and judged by the figure's ruling planet. "
    + "[dom] own house, [exa] exaltation, [det] detriment, [fal] fall.");
  if (sig) L.push("The significator house, the thing demanded, is marked with a star.");
  for (let h = 1; h <= 12; h++){
    const f = F(houses[h]), m = HOUSES[h];
    L.push((h === sig ? "* " : "  ") + pad(String(h),4) + pad(ALLOTMENT.map[h],4) + pad(f.name,16)
      + pad(ring ? ring[h][0] : "-",13) + pad("("+f.el+", "+f.planet+"; "+f.nature+")",34)
      + pad(dignityOf(f,h) ? "[" + dignityOf(f,h).slice(0,3) + "]" : "",6) + m.title + " — " + m.keys);
  }
  const perf = perfectionOf(houses, 1, sig);
  if (sig){
    const f = F(houses[sig]), m = HOUSES[sig], dg = dignityOf(f, sig);
    L.push("");
    L.push("SIGNIFICATOR  house " + sig + " · " + ALLOTMENT.map[sig]
      + " — " + m.title + " (" + m.keys + ")");
    L.push("  " + pad("Figure",16) + pad(f.name,16) + f.key
      + "   (" + f.el + ", " + f.planet + "; " + f.nature + ")");
    L.push("  " + pad("Figure reads",16) + f.reading);
    L.push("  " + pad("Falling here",16) + f.name + " brings " + f.keys + " to bear on " + m.keys + ".");
    L.push("  " + pad("Dignity",16) + (ring ? ring[sig][0] + " on this house; " : "")
      + (dg ? f.name + " is " + DIG_WORD[dg] + "." : f.name + " has no accidental dignity here."));
    L.push("  " + pad("GD generally",16) + GD[f.name][0]);
    L.push("  " + pad("GD in the " + ord(sig),16) + GD[f.name][sig]);
    /* only the houses a figure actually travels to: the aspect geometry itself
       is the same in every chart and says nothing about this one */
    const repeats = ALL_HOUSES.filter(t => t !== sig && houses[t] === houses[sig]);
    if (repeats.length) L.push("  " + pad("Passes to",16) + f.name + " stands again in "
      + repeats.map(t => "house " + t + " (" + relationTag(perf, sig, t) + ")").join(", "));
    else L.push("  " + pad("Passes to",16) + f.name + " stands in no other house");
    L.push("  " + pad("Next door",16) + [norm(sig-1), norm(sig+1)]
      .map(t => "house " + t + " " + F(houses[t]).name).join(" \u00b7 ")
      + "   (four of the five modes are read from neighbouring houses)");
    if (sig !== 1) L.push("  " + pad("The querent",16) + "house 1 " + F(houses[1]).name
      + " (" + F(houses[1]).el + ", " + F(houses[1]).planet + ")"
      + (houses[1] === houses[sig]
          ? " — one figure stands in both houses; the matter perfects by occupation"
          : " — the querent's own figure, to be weighed against this one"));
    L.push("  " + pad("Reconciler",16) + pad(F(addFig(sh.Judge, houses[sig])).name,16)
      + addFig(sh.Judge, houses[sig]) + "   (Judge + this house)");
    L.push(sig === 1
      ? "The querent's own house is the thing demanded; judge the question from it, the Judge over all."
      : "Judge the question from this house, the first house for the querent, the Judge over both.");
  }
  L.push("");
  if (!perf.testable){
    L.push("PERFECTION  not testable — no significator chosen, so there is no second pole");
    L.push("  Choose the house of the thing demanded and the four modes are tested against house 1.");
  } else {
    const vd = summaryOf(perf);
    L.push("PERFECTION  house 1, the querent — house " + sig + ", the thing demanded");
    L.push("  " + vd.line + (vd.against ? "   " + vd.against : ""));
    L.push("  After Greer, chapter 6: occupation, conjunction, mutation and translation are read");
    L.push("  from houses being NEXT TO one another; favourable aspect (sextile, trine) is a mode");
    L.push("  of its own and counts only once a significator has passed to some other house. The");
    L.push("  aspect between house 1 and house " + sig + " is never read. Square and opposition deny.");
    L.push("  These are the findings, not a judgment: weigh them against the Judge, the witnesses,");
    L.push("  the natures of the figures and the question actually asked.");
    perfectionSentences(perf).forEach(t => L.push("  " + t));
  }
  L.push("");
  L.push("ELEMENTS  " + Object.keys(tally).map(e => e+" "+tally[e]).join("  ·  "));
  L.push("END OF MATTER (4th house)  " + F(houses[4]).name);
  L.push("PART OF FORTUNE  house " + pofx.house + " (" + pofx.code + "), from "
    + pofx.total + " points over the twelve figures");
  firstHouseNotes(houses).forEach(t => L.push("NOTE  " + t));
  return L.join("\n");
}

/* How one house stands to another that holds the same figure. Between the two
   houses of the question that is occupation, and never an aspect: the aspect
   there is the same in every chart and the rules forbid reading it. */
function relationTag(res, from, to){
  if (res && res.testable
      && ((from === res.q && to === res.s) || (from === res.s && to === res.q)))
    return "occupation";
  if (isAdjacent(from, to)) return "next door";
  const A = aspectFrom(from, to);
  return A ? (A.dir ? A.dir + " " : "") + A.kind.toLowerCase() : "no relation";
}

/* Named only for the kinds of line actually on the chart, so the key never
   promises a channel the cast does not have. */
function chanLegendHTML(houses, res){
  const L = channelLines(houses, res, state.selected);
  if (!L.length) return "";
  const kinds = ["carry","deny","pass"].filter(k => L.some(l => l.kind === k));
  return '<div class="legend chankey">' + kinds.map(k =>
      '<span class="lg"><i class="lgline" style="border-top-color:' + CHANNEL[k].stroke
      + ';border-top-style:' + (CHANNEL[k].dash === "none" ? "solid" : "dashed")
      + '"></i>' + CHANNEL[k].label + '</span>').join("")
    + '</div>';
}

/* Under Greer's rules it is the neighbouring houses that carry four of the five
   modes, so they lead here. A figure "passes" by standing again somewhere else,
   and that is the only chart-dependent fact in the panel; the aspect table is
   the same in every chart, so it is kept at the foot and marked as fixed. */
function channelsHTML(houses, h, res){
  const here = houses[h], nb = [norm(h-1), norm(h+1)];
  const row = (k,v,cls) => '<div class="chanrow'+(cls?" "+cls:"")+'"><span class="chank">'
    + k + '</span><span>' + v + '</span></div>';
  let out = "";

  out += row("Next door", nb.map(t => "house " + t + " " + BY_KEY[houses[t]].name).join(" \u00b7 ")
    + " \u2014 conjunction, mutation and translation are all read from houses lying side by side.");

  const passes = ALL_HOUSES.filter(t => t !== h && houses[t] === here);
  if (passes.length)
    out += row("Passes to", BY_KEY[here].name + " stands again in "
      + passes.map(t => "house " + t + " (" + relationTag(res, h, t) + ")").join(", ")
      + " \u2014 a figure reaches anything only by passing, so this is what the modes are built from.");
  else
    out += row("Passes nowhere", BY_KEY[here].name + " stands in no other house, so this house can "
      + "reach the rest of the chart only by what comes to it.", "dead");

  /* when this house is one of the two poles, name what actually carried */
  if (res.testable && (h === res.q || h === res.s)){
    const tr = res.modes.filter(m => m.mode === "Translation");
    if (tr.length)
      out += row("Translators", tr[0].carriers.map(c => BY_KEY[c.figure].name
          + " (house " + c.toQ + " by house " + res.q + ", house " + c.toS + " by house " + res.s + ")")
        .join(" \u00b7 ") + " \u2014 standing next to both houses of the question, and so carrying "
        + "between them.");
    const fa = res.modes.filter(m => m.mode === "Favourable aspect")[0];
    if (fa)
      out += row("Carries by aspect", fa.legs.map(x => "house " + x.at + " "
          + BY_KEY[houses[x.at]].name + " in " + (x.dir ? x.dir + " " : "")
          + x.kind.toLowerCase() + " to house " + x.from).join(" \u00b7 ")
        + " \u2014 a figure that has passed reaches the other pole by sextile or trine; "
        + "dexter, against the order of the houses, is the stronger.");
    if (res.hard.length)
      out += row("Against it", res.hard.map(x => x.kind.toLowerCase() + " at house " + x.house)
        .join(" \u00b7 ") + " \u2014 square and opposition deny a chart, or obstruct one that "
        + "perfects otherwise.", "dead");
  }

  return '<div class="asp"><span class="eyebrow">Channels from house '+h+'</span>'
    + out + '</div>';
}

function perfectionCardHTML(res, judgeKey){
  if (!res.testable)
    return '<div class="perf"><span class="eyebrow">Perfection</span>'
      + '<p class="pprompt">Name the house of the thing demanded \u2014 the significator \u2014 and the '
      + 'chart will report which perfections hold between it and house 1.</p></div>';
  const v = summaryOf(res);
  return '<div class="perf ' + (v.found ? "found" : "none") + '">'
    + '<span class="eyebrow">Perfection \u00b7 house ' + res.q + ' and house ' + res.s + '</span>'
    + '<p class="pverdict p' + (v.found ? "found" : "none") + '">' + v.line + '</p>'
    + (v.against ? '<p class="pterm">' + v.against + '</p>' : "")
    + '<button type="button" class="linkish pmore" data-explain="1">Explain</button></div>';
}

function perfectionDetailHTML(res, judgeKey){
  if (!res.testable) return "";
  const v = summaryOf(res);
  const body = perfectionSentences(res).map(t => {
    const head = t.slice(0, t.indexOf(". "));
    return '<div class="pmode"><span class="pk'
      + (/^(Impedited|Denied|Difficulties)/.test(head) ? " deny" : "") + '">' + head + '</span>'
      + '<p class="ptext">' + t.slice(t.indexOf(". ") + 2) + '</p></div>';
  }).join("");
  return '<p class="pverdict p' + (v.found ? "found" : "none") + '">' + v.line + '</p>'
    + (v.against ? '<p class="pterm">' + v.against + '</p>' : "")
    + '<p class="pdirect">Interpret the following perfections against the Judge ('
    + BY_KEY[judgeKey].name + ', ' + BY_KEY[judgeKey].nature + '), the witnesses, the natures of '
    + 'the figures and the question actually asked. Write the good on '
    + 'one side and the evil on the other, and form the final judgment from the balance of them.</p>'
    + body
    + '<p class="pnote">After Greer, <em>The Art and Practice of Geomancy</em>, chapter six. '
    + 'Occupation is one figure in both houses; conjunction, a significator passing next to the '
    + 'other\u2019s; mutation, both passing to houses side by side; translation, a third figure next '
    + 'to both \u2014 neighbouring houses, not aspect. Favourable aspect, sextile or trine, is a mode '
    + 'of its own; square and opposition deny. Company of houses is not implemented.</p>'
    + '<p class="pnote">The rest is Golden Dawn: allotment, dignities, tables, Part of Fortune and '
    + 'Reconciler follow Regardie\u2019s <em>Book Eight</em>, the Zelator paper and Henson\u2019s '
    + '<em>By the Signs of the Earth</em>. None of the three uses perfection at all \u2014 there the '
    + 'Judge answers on its own and the houses give detail. Perfection is Greer\u2019s, laid over that.</p>';
}

/* the drawer lives outside the re-rendered chart, so opening it animates and a
   re-render behind it (a new significator, say) refreshes it in place */
let explainHTML = "", explainTitle = "Perfection in full";
function setExplain(html, title){
  explainHTML = html;
  explainTitle = title || "Perfection in full";
  if (document.body.classList.contains("explaining")){
    $("drawerbody").innerHTML = html;
    $("drawertitle").textContent = explainTitle;
  }
}
function openExplain(){
  if (!explainHTML) return;
  $("drawerbody").innerHTML = explainHTML;
  $("drawertitle").textContent = explainTitle;
  $("drawer").classList.add("open");
  $("scrim").classList.add("open");
  document.body.classList.add("explaining");
  $("drawerclose").focus();
}
function closeExplain(){
  $("drawer").classList.remove("open");
  $("scrim").classList.remove("open");
  document.body.classList.remove("explaining");
}

function render(){
  const parsed = parseCast(state.raw), p = parsed.pts, ready = !parsed.error && p.length === 16;

  /* mothers strip + counter */
  let ms = "";
  for (let i=0;i<4;i++){
    const m = parsed.error ? "" : p.slice(i*4, i*4+4).join("");
    ms += '<div class="mslot"><span class="mlabel">M'+(i+1)+'</span>'
        + (m.length===4 ? tinted(m,0.9) : '<div class="mempty"></div>') + '</div>';
  }
  $("mothers").innerHTML = ms;
  $("count").textContent = ready ? "" : (parsed.error ? "\u2014" : p.length) + "/16";

  $("hint").innerHTML = parsed.error ? esc(parsed.error)
    : state.notice ? esc(state.notice)
    : (p.length === 0 || ready
        ? "1 for a single point, 2 for a double point."
        : (16-p.length) + " point" + (16-p.length===1?"":"s") + " still to enter.");
  $("hint").className = "hint" + (parsed.error ? " bad" : "");
  $("cast").className = "cast" + (parsed.error ? " bad" : "");
  $("cast").setAttribute("aria-invalid", parsed.error ? "true" : "false");
  $("save").disabled = !ready;
  document.body.classList.toggle("viewing", state.viewing);

  if (!ready){
    state.currentId = null;
    setExplain(""); closeExplain();
    $("out").innerHTML = (p.length === 0 && !parsed.error) ? savedListHTML() : "";
    return;
  }

  state.editingId = null;

  const sh = deriveShield(p), map = ALLOTMENT.map, houses = {};
  for (const h in map) houses[h] = sh[map[h]];

  const tally = {Fire:0,Air:0,Water:0,Earth:0};
  for (const h in houses) tally[BY_KEY[houses[h]].el]++;
  houses.judgeKey = sh.Judge;
  houses.sig = state.sig || 0;
  const pof = partOfFortune(sh, map);
  houses.pof = pof.house;
  /* the querent is always the first house; the thing demanded is the chosen
     significator, and without one there are not two poles to perfect between */
  const perf = perfectionOf(houses, 1, state.sig || 0);
  setExplain(perfectionDetailHTML(perf, sh.Judge),
    perf.testable ? "Perfection \u00b7 house " + perf.q + " and house " + perf.s : null);

  const J = BY_KEY[sh.Judge];
  const wit = (label,fig) =>
    '<div class="fcard">'+tinted(fig,1.15)+'<div><div class="fcard-label">'+label+'</div>'
    + '<div class="fcard-name">'+BY_KEY[fig].name+'</div>'
    + '<div class="fcard-meta">'+BY_KEY[fig].el+' · '+BY_KEY[fig].planet+'</div></div></div>';

  let reading;
  if (state.selected){
    const h = state.selected, f = BY_KEY[houses[h]], m = HOUSES[h];
    const ring = signRing(houses), dg = dignityOf(f, h);
    const dig = (ring ? "House sign <span class=\"sym\">" + ring[h][1] + "</span> " + ring[h][0] + ". " : "")
      + (dg ? f.name + " is " + DIG_WORD[dg] + "." : f.name + " has no accidental dignity here.");
    reading = '<div class="reading"><div class="rhead"><span class="eyebrow">House '+h+' · '+map[h]+'</span>'
      + '<h2>'+m.title+'</h2><p class="rkeys">'+m.keys+'</p></div>'
      + '<div class="rfig">'+tinted(f.key,1.5)+'<div><div class="rname">'+f.name+' <em>'+f.gloss+'</em></div>'
      + '<div class="rmeta">'+f.el+' · '+f.planet+' · '+f.sign+' · '+f.nature+'</div></div></div>'
      + '<p class="rread">'+f.reading+'</p>'
      + '<p class="rjoin"><strong>'+f.name+'</strong> falling in the '+ord(h)+' brings '+f.keys+' to bear on '+m.keys+'.</p>'
      + '<p class="rgd"><span class="gdtag">GD</span> '+GD[f.name][0]
      + ' <em>In the '+ord(h)+':</em> '+GD[f.name][h]+'</p>'
      + '<p class="rdig">'+dig+'</p>'
      + channelsHTML(houses, h, perf)
      + '</div>';
  } else {
    reading = '<div class="reading empty"><span class="eyebrow">Selected house</span>'
      + '<p>Tap any house in the chart to read the figure that fell there, and the channels '
      + 'along which anything reaches it.</p></div>';
  }

  $("out").innerHTML =
    '<div class="viewbar"><button id="back" class="back" type="button">\u2190 Back</button>'
    + '<div class="vbq'+(state.question ? "" : " none")+'">'
    + esc(state.question || "No question recorded") + '</div>'
    + (state.sig ? '<div class="vbsig">Significator \u00b7 house '+state.sig+'</div>' : "")
    + '</div>'
    + '<div class="grid"><section class="chartpane">'
    + '<div class="charthead"><div class="method">'
    + [["shield","Shield"],["square","Square"],["wheel","Wheel"]].map(v =>
        '<button class="vlink'+(state.view===v[0]?" on":"")+'" data-v="'+v[0]+'">'+v[1]+'</button>').join("")
    + '</div></div>'
    + (state.view === "shield" ? shieldSVG(sh, houses)
       : state.view === "wheel" ? wheelSVG(houses, perf) : chartSVG(houses, perf))
    + '<div class="legend">' + Object.keys(EL).map(e =>
        '<span class="lg"><i style="background:'+EL[e].c+'"></i>'+e+' · '+tally[e]+'</span>').join("")
    + '</div>'
    + (state.view === "shield" ? "" : chanLegendHTML(houses, perf))
    + '</section><section class="side">' + perfectionCardHTML(perf, sh.Judge) + reading
    + '<div class="verdict"><div class="vhead"><span class="eyebrow">Judge</span>'
    + '<span class="vname" style="color:'+EL[J.el].c+'">'+J.name+'</span></div>'
    + '<div class="vbody">'+tinted(J.key,1.7)+'<div><p class="vread">'+J.reading+'</p>'
    + '<p class="vnat">Nature: <strong>'+J.nature+'</strong> · '+J.el+' · '+J.planet+'</p></div></div>'
    + (JUDGEABLE.has(sh.Judge) ? "" : '<p class="err">This figure cannot arise as a Judge — check the cast.</p>')
    + '<div class="wits">'
    + wit("Right witness · the ninth and tenth figures", sh.RW)
    + wit("Left witness · the eleventh and twelfth figures", sh.LW)
    + wit("Reconciler · Judge + house " + (state.selected || houses.sig || 1)
          + (state.selected || houses.sig ? "" : " — tap the house of the thing demanded"),
          addFig(sh.Judge, houses[state.selected || houses.sig || 1]))
    + '</div>'
    + '<div class="fourth"><span class="eyebrow">Part of Fortune ⊗</span>'
    + '<div class="fourth-in"><span>House ' + pof.house + ' — ready money in the querent\u2019s hands, '
    + 'and of the greatest importance in questions of money.</span></div></div>'
    + '<div class="fourth"><span class="eyebrow">Fourth house · the end of the matter</span>'
    + '<div class="fourth-in">'+tinted(houses[4],1)+'<span>'+BY_KEY[houses[4]].name+' — '+BY_KEY[houses[4]].keys+'</span></div>'
    + '</div></div></section></div>'
    + '<section class="export"><div class="exphead"><span class="eyebrow">Export for AI interpretation</span>'
    + '<button id="copy" class="paste" type="button">Copy</button></div>'
    + '<textarea class="expbox" id="expbox" readonly spellcheck="false" rows="16">'
    + esc(exportText(sh, houses, tally)) + '</textarea></section>';
}

/* inline editing of a saved record: the question is written straight through to
   storage, and the row's own display line is kept in step without a re-render
   so the caret is never thrown out of the field. */
document.addEventListener("input", e => {
  const n = e.target.closest && e.target.closest("[data-note]");
  if (!n) return;
  const v = e.target.value;
  updateCast(n.dataset.note, { note: v });
  const row = n.closest(".crow"), disp = row && row.querySelector(".cnote");
  if (disp){
    disp.textContent = v || "No question recorded";
    disp.className = "cnote" + (v ? "" : " none");
  }
});
document.addEventListener("change", e => {
  const s = e.target.closest && e.target.closest("[data-sig]");
  if (!s) return;
  updateCast(s.dataset.sig, { sig: +e.target.value });
  render();
});

document.addEventListener("change", e => {
  if (e.target.id !== "xferfile" || !e.target.files[0]) return;
  const f = e.target.files[0];
  if (f.size > 2e6){ state.xferMsg = "That file is too large to be a list of casts."; state.xferBad = true; render(); return; }
  f.text().then(importCasts, () => { state.xferMsg = "The file could not be read."; state.xferBad = true; })
   .then(render);
});

$("sigsel").innerHTML = sigOptions(0);

/* a pasted journal line fills the question and significator alongside the
   points; plain digits fall straight through to the old behaviour */
function takeCast(txt){
  state.selected = null;
  const entry = parseEntry(txt);
  if (!entry){ state.raw = txt; state.notice = null; render(); return; }
  state.raw = entry.pts;
  $("cast").value = entry.pts;
  const got = [];
  if (entry.question){
    state.question = entry.question; $("question").value = entry.question;
    got.push("the question");
  }
  if (entry.sig){
    state.sig = entry.sig; $("sigsel").value = String(entry.sig);
    got.push("house " + entry.sig + " as significator");
  }
  state.notice = got.length ? "Read from the line: " + got.join(", ") + "." : null;
  render();
}

$("cast").addEventListener("input", e => { takeCast(e.target.value); });
$("question").addEventListener("input", e => { state.question = e.target.value; render(); });
$("sigsel").addEventListener("change", e => { state.sig = +e.target.value; render(); });

/* keeping the record is deliberate: it stores the cast with its question and
   significator, then stands back so only the chart is left on screen */
$("save").addEventListener("click", () => {
  const parsed = parseCast(state.raw);
  if (parsed.error || parsed.pts.length !== 16) return;
  state.currentId = rememberCast(parsed.pts.join(""), state.question, state.sig);
  state.viewing = true;
  state.pendingDel = null; state.editingId = null;
  render();
  window.scrollTo(0, 0);
});

function clearDraft(){
  state.raw = ""; state.question = ""; state.sig = 0;
  state.viewing = false; state.currentId = null; state.selected = null; state.pendingDel = null;
  state.notice = null; state.xferOpen = false; state.xferMsg = null;
  $("cast").value = ""; $("question").value = ""; $("sigsel").value = "0";
}

$("paste").addEventListener("click", () => {
  const clip = navigator.clipboard && navigator.clipboard.readText && navigator.clipboard.readText();
  if (!clip) return pasteFallback();
  clip.then(txt => {
    const t = (txt || "").trim();
    $("cast").value = t;
    takeCast(t);
  }).catch(pasteFallback);
});
function pasteFallback(){
  $("cast").focus(); $("cast").select();
  $("hint").textContent = "Clipboard blocked here \u2014 long-press the field and choose Paste.";
  $("hint").className = "hint bad";
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.body.classList.contains("explaining")) closeExplain();
});
document.addEventListener("click", e => {
  if (e.target.closest("[data-explain]")){ openExplain(); return; }
  if (e.target.id === "scrim" || e.target.closest("#drawerclose")){ closeExplain(); return; }
  if (e.target.closest("#drawer")) return;          /* leave the open drawer alone */
  const del = e.target.closest("[data-del]");
  if (del){
    const id = del.dataset.del;
    if (state.pendingDel === id){ deleteCast(id); state.pendingDel = null; if (state.editingId === id) state.editingId = null; }
    else state.pendingDel = id;
    render(); return;
  }
  const ed = e.target.closest("[data-edit]");
  if (ed){
    const id = ed.dataset.edit;
    state.editingId = state.editingId === id ? null : id;
    state.pendingDel = null;
    render();
    const field = document.querySelector('[data-note="'+id+'"]');
    if (field) field.focus();
    return;
  }
  if (e.target.closest(".cedit")) return;      /* leave the open editor alone */
  const xf = e.target.closest("[data-xfer]");
  if (xf){
    const act = xf.dataset.xfer, say = (msg, bad) => { state.xferMsg = msg; state.xferBad = !!bad; render(); };
    state.pendingDel = null;
    if (act === "copy"){
      const txt = exportJSON(), count = loadCasts().length;
      const w = navigator.clipboard && navigator.clipboard.writeText && navigator.clipboard.writeText(txt);
      const manual = () => { state.xferOpen = true; say("Clipboard blocked here \u2014 copy from the box below.", true);
                             const b = $("xfertext"); if (b){ b.value = txt; b.focus(); b.select(); } };
      if (w) w.then(() => say(count + " cast" + (count===1?"":"s") + " copied to the clipboard.")).catch(manual);
      else manual();
    } else if (act === "download"){
      const url = URL.createObjectURL(new Blob([exportJSON()], { type:"application/json" }));
      const a = document.createElement("a");
      a.href = url; a.download = "geomantica-casts-" + new Date().toISOString().slice(0,10) + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } else if (act === "paste"){
      state.xferOpen = !state.xferOpen; state.xferMsg = null; render();
      const b = $("xfertext"); if (b) b.focus();
    } else if (act === "upload"){
      $("xferfile").click();
    } else if (act === "import"){
      importCasts($("xfertext").value); render();
    }
    return;
  }
  if (e.target.closest(".xfer")) return;       /* typing in the import box */
  if (e.target.id === "back"){
    clearDraft();
    render();
    window.scrollTo(0, 0);
    return;
  }
  const open = e.target.closest("[data-open]");
  if (open){
    const c = getCast(open.dataset.open);
    if (c){
      state.raw = c.pts.replace(/(.{4})(?=.)/g, "$1,");
      state.question = c.note || ""; state.sig = c.sig || 0;
      state.currentId = c.id; state.viewing = true; state.notice = null;
      state.selected = null; state.pendingDel = null; state.editingId = null;
      $("cast").value = state.raw;
      $("question").value = state.question;
      $("sigsel").value = String(state.sig);
      render();
      window.scrollTo(0, 0);
    }
    return;
  }
  if (state.pendingDel){ state.pendingDel = null; render(); }
  if (e.target.id === "ex"){
    clearDraft();
    state.raw = "1111,1222,1221,2122";
    state.question = "Will the book I am writing find a publisher?";
    state.sig = 5;                       /* Issue \u2014 creation, the work of one's own hands */
    state.viewing = true;
    $("cast").value = state.raw;
    $("question").value = state.question;
    $("sigsel").value = "5";
    render();
    window.scrollTo(0, 0);
    return;
  }
  const v = e.target.closest("[data-v]");
  if (v){
    state.view = v.dataset.v;
    try { localStorage.setItem("geomancy-view", state.view); } catch (e) {}
    render(); return;
  }
  if (e.target.id === "copy"){
    const box = $("expbox"), btn = e.target;
    const done = () => { btn.textContent = "Copied"; setTimeout(() => { btn.textContent = "Copy"; }, 1400); };
    const w = navigator.clipboard && navigator.clipboard.writeText && navigator.clipboard.writeText(box.value);
    if (w) w.then(done).catch(() => { box.focus(); box.select(); });
    else { box.focus(); box.select(); }
    return;
  }
  if (e.target.closest("[data-hub]")){
    if (state.selected){ state.selected = null; render(); }
    return;
  }
  const r = e.target.closest("[data-h]");
  if (r){ const h = +r.dataset.h; state.selected = state.selected === h ? null : h; render(); }
});
render();
</script>
</body>
</html>
